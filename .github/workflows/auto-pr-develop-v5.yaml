name: Auto PR develop -> v5

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update PR to v5
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'develop';
            const title = 'chore: develop → v5';
            const body = 'PR automática gerada a partir do branch develop para o branch v5.';
            const head = `${owner}:${branch}`;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base: 'v5',
            });
            if (pulls.length > 0) {
              core.info(`Pull request already exists: ${pulls[0].html_url}`);
            } else {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base: 'v5',
                body,
                draft: false,
              });
              core.info(`Created PR: ${pr.data.html_url}`);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.data.number,
                labels: ['automatic', 'release'],
              });
            }
